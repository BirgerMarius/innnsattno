project:
  name: innsatt.no
  shortName: innsatt-no
  instructions:
    primary: PROJECT.md
    rules: context/project-rules.md

type:
  application: web
  framework: laravel
  language: php

repository:
  provider: github
  url: git@github.com:BirgerMarius/innnsattno.git
  defaultBranch: main

deployment:
  strategy: git-pull
  requiresExplicitApproval: true

workflow:
  mode: simple
  workPackages: optional
  commitLanguage: norwegian
  commitAndPushRequireExplicitInstruction: true
  productionDeploySeparate: true

runtime:
  prompt: developer
  testing: autonomous

paths:
  context: context
  backlog: backlog
  workPackages: work-packages
  reviews: reviews
  releases: releases
